<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>KELULUSAN GABEN</title>
    <script>
      (function() {
        try {
          const originalFetch = window.fetch || globalThis.fetch;
          if (originalFetch) {
            let currentFetch = originalFetch;
            const descriptor = {
              get() {
                return currentFetch;
              },
              set(val) {
                currentFetch = val;
              },
              configurable: true,
              enumerable: true
            };
            try {
              Object.defineProperty(window, 'fetch', descriptor);
            } catch (e) {
              console.warn("Could not define fetch on window:", e);
            }
            if (typeof globalThis !== 'undefined') {
              try {
                Object.defineProperty(globalThis, 'fetch', descriptor);
              } catch (e) {
                console.warn("Could not define fetch on globalThis:", e);
              }
            }
            if (typeof self !== 'undefined') {
              try {
                Object.defineProperty(self, 'fetch', descriptor);
              } catch (e) {
                console.warn("Could not define fetch on self:", e);
              }
            }
          }
        } catch (e) {
          console.warn("Window fetch patch failed:", e);
        }
      })();
    </script>
  </head>
  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
